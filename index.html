<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Schema Checker — by Propellic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Propellic brand palette */
      --bg: #f5f6f9;
      --surface: #ffffff;
      --border: #e1e2e3;
      --text: #181721;
      --text-muted: #5a617c;
      --accent: #e21a6b;
      --accent-hover: #c9155d;
      --accent-light: #fef4f8;
      --accent-muted: rgba(226, 26, 107, 0.08);
      --accent-border: rgba(226, 26, 107, 0.2);
      --brand-black: #181721;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --green-border: #bbf7d0;
      --yellow: #b45309;
      --yellow-bg: #fffbeb;
      --yellow-border: #fde68a;
      --red: #dc2626;
      --red-bg: #fff1f2;
      --red-border: #fecdd3;
      --gray: #4b5563;
      --gray-bg: #f3f4f6;
      --gray-border: #d1d5db;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.06);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 0 16px 64px;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 56px 0 40px;
    }

    header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    header .logo svg { width: 36px; height: 36px; }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .propellic-badge {
      display: inline-block;
      margin-top: 12px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #99a0b9;
      letter-spacing: 0.02em;
    }

    .propellic-badge strong { font-weight: 700; color: var(--accent); }
    .propellic-badge strong sup { font-size: 0.6em; }

    /* ── Mode toggle ── */
    .mode-toggle {
      display: flex;
      gap: 3px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      width: fit-content;
      margin: 0 auto 10px;
      box-shadow: var(--shadow);
    }

    .mode-btn {
      padding: 7px 20px;
      font-size: 0.84rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      transition: all 0.15s;
      font-family: inherit;
      letter-spacing: 0.01em;
    }

    .mode-btn.active { background: var(--accent); color: #fff; }
    .mode-btn:not(.active):hover { background: var(--bg); color: var(--text); }

    /* ── Search bar ── */
    .search-wrap {
      max-width: 680px;
      margin: 0 auto 40px;
    }

    .search-box {
      display: flex;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .search-box:focus-within { border-color: var(--accent); }

    .search-box input {
      flex: 1;
      padding: 16px 18px;
      font-size: 1rem;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
      min-width: 0;
      font-family: inherit;
    }

    .search-box input::placeholder { color: #adadad; }

    .search-box button {
      padding: 0 26px;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
      font-family: inherit;
    }

    .search-box button:hover { background: var(--accent-hover); }
    .search-box button:disabled { background: rgba(226,26,107,0.4); cursor: not-allowed; }

    /* ── Results container ── */
    #results { max-width: 680px; margin: 0 auto; }

    /* ── Loading ── */
    .loading-steps {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 48px 0;
      align-items: center;
    }

    .loading-step {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--text-muted);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s, transform 0.4s;
    }

    .loading-step.visible { opacity: 1; transform: translateY(0); }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Score card ── */
    .score-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .score-label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .score-value { font-size: 2rem; font-weight: 800; letter-spacing: -1px; }
    .score-value span { font-size: 0.95rem; font-weight: 500; color: var(--text-muted); }

    .score-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
      word-break: break-all;
    }

    .score-bar-wrap { flex: 1; min-width: 160px; max-width: 280px; }

    .score-bar-track {
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #e21a6b, #fa0065);
      border-radius: 99px;
      width: 0;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .score-bar-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; }

    .pages-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-muted);
      border: 1px solid var(--accent-border);
      padding: 3px 10px;
      border-radius: 99px;
      margin-top: 8px;
    }

    /* ── Page meta (single scan) ── */
    .page-meta {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      font-size: 0.85rem;
    }

    .page-meta-title { font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .page-meta-desc { color: var(--text-muted); line-height: 1.5; }

    /* ── Sections (✅ / ⚠️ / ❌) ── */
    .section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
      background: #fafaf9;
    }

    .section-header h2 { font-size: 0.9rem; font-weight: 700; }

    .section-count {
      margin-left: auto;
      font-size: 0.74rem;
      font-weight: 700;
      background: #ebebeb;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* ── Schema items ── */
    .schema-item { border-bottom: 1px solid var(--border); }
    .schema-item:last-child { border-bottom: none; }

    .schema-item-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 20px;
      cursor: pointer;
      user-select: none;
    }

    .schema-item-header:hover { background: #fafaf9; }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .badge-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
    .badge-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .badge-red    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
    .badge-gray   { background: var(--gray-bg);   color: var(--gray);   border: 1px solid var(--gray-border); }

    .item-body { flex: 1; min-width: 0; }
    .item-title { font-size: 0.88rem; font-weight: 600; margin-bottom: 2px; }
    .item-desc { font-size: 0.81rem; color: var(--text-muted); line-height: 1.5; }

    .expand-icon {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      flex-shrink: 0;
      transition: transform 0.2s;
      display: inline-block;
    }

    .expand-icon.open { transform: rotate(180deg); }

    /* ── JSON drawer ── */
    .json-drawer { display: none; border-top: 1px solid var(--border); background: #fafaf9; }
    .json-drawer.open { display: block; }
    .json-drawer pre {
      padding: 14px 20px;
      font-size: 0.75rem;
      line-height: 1.65;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #374151;
      font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
    }

    /* ── Misc item rows ── */
    .error-item, .placeholder-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 20px;
      border-bottom: 1px solid var(--border);
    }

    .error-item:last-child, .placeholder-item:last-child { border-bottom: none; }

    /* ── Empty / error states ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state svg { width: 52px; height: 52px; margin: 0 auto 16px; opacity: 0.25; }
    .empty-state h3 { font-size: 1rem; font-weight: 700; color: #8a8a8a; margin-bottom: 6px; }
    .empty-state p { font-size: 0.87rem; }

    .error-banner {
      background: var(--red-bg);
      border: 1.5px solid var(--red-border);
      border-radius: var(--radius);
      padding: 18px 22px;
      color: var(--red);
      font-size: 0.9rem;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    /* ── Page cards (site scan) ── */
    .page-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    .page-card-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }

    .page-card-header:hover { background: #fafaf9; }

    .page-card-main { flex: 1; min-width: 0; }

    .page-category-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--accent);
      background: var(--accent-muted);
      border: 1px solid var(--accent-border);
      padding: 2px 8px;
      border-radius: 99px;
      margin-bottom: 7px;
    }

    .page-card-title-text {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-card-url-text {
      font-size: 0.77rem;
      color: var(--text-muted);
      word-break: break-all;
    }

    .page-card-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .count-pill {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .count-pill-green  { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
    .count-pill-yellow { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }

    .page-card-body {
      display: none;
      border-top: 1.5px solid var(--border);
      padding: 16px;
      background: var(--bg);
    }

    .page-card-body.open { display: block; }

    /* Sections nested inside page cards: no outer shadow, slightly smaller radius */
    .page-card-body .section {
      box-shadow: none;
      border-radius: 8px;
    }

    .page-card-body .section:last-child { margin-bottom: 0; }

    /* Error variant of the body */
    .page-card-body.is-error {
      color: var(--red);
      background: var(--red-bg);
      padding: 14px 20px;
      flex-direction: row;
      gap: 8px;
      align-items: flex-start;
      font-size: 0.87rem;
    }

    .page-card-body.is-error.open { display: flex; }

    /* ── Categories not found ── */
    .not-found-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .not-found-section h3 {
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .not-found-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.84rem;
      color: var(--text-muted);
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.5;
    }

    .not-found-item:last-child { border-bottom: none; padding-bottom: 0; }
    .not-found-item:first-child { padding-top: 0; }

    /* ── AI analysis panel ── */
    .ai-summary {
      background: linear-gradient(135deg, #fef4f8 0%, #fff8fb 100%);
      border: 1.5px solid var(--accent-border);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 14px;
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text);
    }

    .ai-summary-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .page-type-line {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .confidence-tag {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .conf-high   { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
    .conf-medium { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .conf-low    { background: var(--gray-bg);   color: var(--gray);   border: 1px solid var(--gray-border); }

    .ai-score-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .score-high   { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-border); }
    .score-medium { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .score-low    { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }

    .schema-issues {
      margin-top: 6px;
      padding-left: 12px;
      border-left: 2px solid var(--yellow-border);
    }

    .schema-issue-item {
      font-size: 0.78rem;
      color: var(--yellow);
      line-height: 1.5;
      padding: 2px 0;
    }

    .missing-item {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .missing-item:last-child { border-bottom: none; }

    .missing-item-body { flex: 1; min-width: 0; }

    .missing-item-title {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .missing-item-reason {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 6px;
    }

    .field-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .field-tag {
      font-size: 0.68rem;
      font-weight: 600;
      background: var(--gray-bg);
      color: var(--gray);
      border: 1px solid var(--gray-border);
      padding: 1px 7px;
      border-radius: 99px;
      font-family: "Fira Code", Consolas, monospace;
    }

    .priority-badge {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .pri-high   { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-border); }
    .pri-medium { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }
    .pri-low    { background: var(--gray-bg);   color: var(--gray);   border: 1px solid var(--gray-border); }

    .ai-unavailable {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 10px 20px;
    }

    /* ── Fetch-method badges ── */
    .fetch-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .fetch-badge-static {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .fetch-badge-rendered {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    /* ── Discovery-method badges ── */
    .discovery-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      margin-top: 6px;
      white-space: nowrap;
    }

    .discovery-badge-sitemap {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .discovery-badge-links {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    /* ── Animations ── */
    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.35s ease forwards;
    }

    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

    .fade-in:nth-child(1) { animation-delay: 0.00s; }
    .fade-in:nth-child(2) { animation-delay: 0.06s; }
    .fade-in:nth-child(3) { animation-delay: 0.12s; }
    .fade-in:nth-child(4) { animation-delay: 0.18s; }
    .fade-in:nth-child(5) { animation-delay: 0.24s; }
    .fade-in:nth-child(6) { animation-delay: 0.30s; }
    .fade-in:nth-child(7) { animation-delay: 0.36s; }
    .fade-in:nth-child(8) { animation-delay: 0.42s; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="9" fill="#e21a6b"/>
        <path d="M10 13h6M10 18h10M10 23h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="27" cy="13" r="4" fill="#fff" opacity="0.9"/>
        <path d="M25.5 13l1 1 2-2" stroke="#e21a6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Schema Checker</h1>
    </div>
    <p>Audit your schema markup in seconds.</p>
    <div class="propellic-badge">by <strong>Propellic<sup>®</sup></strong></div>
  </header>

  <div class="search-wrap">
    <div class="mode-toggle">
      <button class="mode-btn active" id="modePageBtn" onclick="setMode('page')">Single Page</button>
      <button class="mode-btn" id="modeSiteBtn" onclick="setMode('site')">Whole Site</button>
    </div>
    <div class="search-box">
      <input
        id="urlInput"
        type="url"
        placeholder="https://example.com"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="scanBtn" onclick="startScan()">
        <span id="scanBtnText">Scan Page</span>
      </button>
    </div>
  </div>

  <div id="results">
    <div class="empty-state">
      <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="40" height="40" rx="8" stroke="currentColor" stroke-width="2.5"/>
        <path d="M14 18h10M14 26h16M14 34h12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="38" cy="18" r="5" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <h3>No results yet</h3>
      <p>Enter a URL above and click Scan to audit its schema markup.</p>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────
    let currentMode = "page";

    const PAGE_LOADING_STEPS = [
      "Fetching page...",
      "Extracting schema markup...",
      "Analyzing with AI...",
      "Generating recommendations...",
    ];

    const SITE_LOADING_STEPS = [
      "Checking site structure (sitemap.xml)...",
      "Auto-categorizing discovered pages...",
      "Scanning pages with Playwright + Claude AI...",
      "Generating audit recommendations...",
    ];

    const TYPE_DESCRIPTIONS = {
      Organization:       "Describes the site's business identity — name, logo, and contact info.",
      WebSite:            "Site-level metadata, often includes a SearchAction for sitelinks search box.",
      WebPage:            "Metadata about this specific page.",
      BreadcrumbList:     "Navigation breadcrumb trail enabling rich results in Google.",
      Product:            "A product listing with pricing, availability, and review data.",
      Review:             "A user or editorial review associated with a product or entity.",
      AggregateRating:    "Aggregated star rating compiled from individual reviews.",
      FAQPage:            "Frequently-asked questions — eligible for FAQ rich results.",
      HowTo:              "Step-by-step instructions eligible for HowTo rich results.",
      Article:            "News or blog article with author, publish date, and body content.",
      NewsArticle:        "A news article eligible for Top Stories rich results.",
      BlogPosting:        "A blog post with author and publication metadata.",
      Person:             "An individual — commonly used for author markup.",
      LocalBusiness:      "A physical business location with address, hours, and contact details.",
      Event:              "A scheduled event with date, location, and ticket information.",
      VideoObject:        "Video metadata — name, description, thumbnail, and upload date.",
      ImageObject:        "Image with caption, dimensions, and licensing info.",
      SiteLinksSearchBox: "Enables a search box directly in Google's sitelinks.",
      ItemList:           "An ordered or unordered list of items.",
      ListItem:           "A single item within an ItemList.",
    };

    const NOT_FOUND_NOTES = {
      "Contact Page":                   "A contact page couldn't be detected — double-check the site has one linked from the nav.",
      "Blog Post":                       "No blog post pages found — this site may not publish regular content.",
      "Tour / Service Page":             "No tour or service detail pages detected — normal for simple informational sites.",
      "Category / Destination Listing":  "No category or destination listing pages found — may not apply to this site type.",
      "Product Page":                    "No product pages found — this is expected for service-based businesses.",
    };

    // ── Mode toggle ────────────────────────────────────────────────────────
    function setMode(mode) {
      currentMode = mode;
      document.getElementById("modePageBtn").classList.toggle("active", mode === "page");
      document.getElementById("modeSiteBtn").classList.toggle("active", mode === "site");
      document.getElementById("scanBtnText").textContent = mode === "page" ? "Scan Page" : "Scan Site";
    }

    function describeType(type) {
      if (!type || type === "Unknown") return "Unrecognized schema type — check the @type field.";
      return TYPE_DESCRIPTIONS[type] || `${type} schema detected on this page.`;
    }

    // ── Main entry ─────────────────────────────────────────────────────────
    async function startScan() {
      const input = document.getElementById("urlInput");
      const url = input.value.trim();

      if (!url) {
        input.focus();
        input.style.outline = "2px solid #ef4444";
        setTimeout(() => { input.style.outline = ""; }, 1200);
        return;
      }

      const btn = document.getElementById("scanBtn");
      btn.disabled = true;

      if (currentMode === "page") {
        await runPageScan(url);
      } else {
        await runSiteScan(url);
      }

      btn.disabled = false;
    }

    // ── Single-page scan ───────────────────────────────────────────────────
    async function runPageScan(url) {
      const stopLoading = showLoading(PAGE_LOADING_STEPS, 800);
      try {
        const res = await fetch("/api/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        stopLoading();
        showPageResults(await res.json());
      } catch {
        stopLoading();
        showError("Network error: couldn't reach the server. Is it running?");
      }
    }

    // ── Site scan ──────────────────────────────────────────────────────────
    async function runSiteScan(url) {
      const stopLoading = showLoading(SITE_LOADING_STEPS, 1000);
      try {
        const res = await fetch("/api/scan-site", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        stopLoading();
        showSiteResults(await res.json());
      } catch {
        stopLoading();
        showError("Network error: couldn't reach the server. Is it running?");
      }
    }

    // ── Loading animation ──────────────────────────────────────────────────
    function showLoading(steps, interval) {
      const results = document.getElementById("results");
      results.innerHTML = `<div class="loading-steps">${
        steps.map((s, i) =>
          `<div class="loading-step" id="lstep${i}">
            <div class="spinner"></div><span>${s}</span>
          </div>`
        ).join("")
      }</div>`;

      let current = 0;
      const tick = () => {
        if (current < steps.length) {
          document.getElementById(`lstep${current}`)?.classList.add("visible");
          current++;
        }
      };
      tick();
      const id = setInterval(tick, interval);
      return () => clearInterval(id);
    }

    // ── Single-page results ────────────────────────────────────────────────
    function showPageResults(data) {
      if (data.error) { showError(data.error); return; }

      const { url, pageTitle, metaDescription, schemas, parseErrors, fetchMethod, analysis } = data;
      const displayScore = typeof analysis?.overallScore === "number" ? analysis.overallScore : null;
      const schemaCount = schemas.length + parseErrors.length;
      const fallbackScore = schemaCount === 0 ? 0 : Math.round((schemas.length / schemaCount) * 100);
      const barScore = displayScore !== null ? displayScore : fallbackScore;
      const scoreLabel = displayScore !== null
        ? `AI score: ${displayScore}/100`
        : (schemaCount === 0
          ? "No schemas found"
          : `${schemas.length} valid${parseErrors.length ? `, ${parseErrors.length} with errors` : ""}`);

      const el = document.getElementById("results");
      el.innerHTML = `
        ${singleScoreCard(schemas.length, scoreLabel, url, fetchMethod, analysis)}
        ${(pageTitle || metaDescription) ? pageMeta(pageTitle, metaDescription) : ""}
        ${analysis && !analysis.error ? aiSummaryPanel(analysis) : ""}
        ${schemasSection(schemas, "s", analysis)}
        ${errorsSection(parseErrors, "s")}
        ${missingSection(analysis)}
      `;

      animateBar("scoreBar", barScore);
    }

    function singleScoreCard(validCount, label, url, fetchMethod, analysis) {
      const score = typeof analysis?.overallScore === "number" ? analysis.overallScore : null;
      return `
        <div class="score-card fade-in">
          <div>
            <div class="score-label">Schema Health</div>
            <div class="score-value">${score !== null ? score : validCount}<span>${score !== null ? " / 100" : ` schema${validCount !== 1 ? "s" : ""} found`}</span></div>
            <div class="score-meta">${esc(url)}</div>
            ${fetchMethod ? fetchMethodBadge(fetchMethod) : ""}
          </div>
          <div class="score-bar-wrap">
            <div class="score-bar-track"><div class="score-bar-fill" id="scoreBar"></div></div>
            <div class="score-bar-label">${label}</div>
          </div>
        </div>`;
    }

    function pageMeta(title, desc) {
      return `
        <div class="page-meta fade-in">
          ${title ? `<div class="page-meta-title">${esc(title)}</div>` : ""}
          ${desc  ? `<div class="page-meta-desc">${esc(desc)}</div>`  : ""}
        </div>`;
    }

    // ── Site-scan results ──────────────────────────────────────────────────
    function showSiteResults(data) {
      if (data.error) { showError(data.error); return; }

      const { siteUrl, discoveredPages, discoveryMethod, totalSchemasFound, totalParseErrors, averageAiScore } = data;
      const total = totalSchemasFound + totalParseErrors;
      const fallbackScore = total === 0 ? 0 : Math.round((totalSchemasFound / total) * 100);
      const barScore = averageAiScore !== null && averageAiScore !== undefined ? averageAiScore : fallbackScore;
      const label = averageAiScore !== null && averageAiScore !== undefined
        ? `Average AI score: ${averageAiScore}/100 across ${discoveredPages.length} page${discoveredPages.length !== 1 ? "s" : ""}`
        : (total === 0 ? "No schemas found" : `${totalSchemasFound} valid${totalParseErrors ? `, ${totalParseErrors} with errors` : ""} across ${discoveredPages.length} page${discoveredPages.length !== 1 ? "s" : ""}`);

      const el = document.getElementById("results");
      el.innerHTML = `
        ${siteScoreCard(averageAiScore, totalSchemasFound, label, siteUrl, discoveredPages.length, discoveryMethod)}
        ${discoveredPages.map((p, i) => pageCard(p, i, i === 0)).join("")}
      `;

      animateBar("scoreBar", barScore);
    }

    function siteScoreCard(aiScore, schemaCount, label, siteUrl, pageCount, discoveryMethod) {
      const displayVal = aiScore !== null && aiScore !== undefined ? aiScore : schemaCount;
      const displaySuffix = aiScore !== null && aiScore !== undefined ? " / 100" : ` schema${schemaCount !== 1 ? "s" : ""} found`;
      const discoveryBadge = discoveryMethod === "sitemap"
        ? `<span class="discovery-badge discovery-badge-sitemap">📋 Sitemap-based discovery</span>`
        : `<span class="discovery-badge discovery-badge-links">🔗 Homepage-link discovery</span>`;
      return `
        <div class="score-card fade-in">
          <div>
            <div class="score-label">Site Schema Health</div>
            <div class="score-value">${displayVal}<span>${displaySuffix}</span></div>
            <div class="score-meta">${esc(siteUrl)}</div>
            <div class="pages-badge">📄 ${pageCount} page${pageCount !== 1 ? "s" : ""} scanned</div>
            ${discoveryBadge}
          </div>
          <div class="score-bar-wrap">
            <div class="score-bar-track"><div class="score-bar-fill" id="scoreBar"></div></div>
            <div class="score-bar-label">${label}</div>
          </div>
        </div>`;
    }

    function pageCard(page, idx, expanded) {
      const ns = `p${idx}`;
      const bodyId = `page-body-${idx}`;
      const validCount = page.schemas?.length || 0;
      const errCount = page.parseErrors?.length || 0;
      const hasError = !!page.error;
      const analysis = page.analysis || null;
      const aiScore = typeof analysis?.overallScore === "number" ? analysis.overallScore : null;

      const header = `
        <div class="page-card-header" onclick="togglePageCard('${bodyId}')">
          <div class="page-card-main">
            <div class="page-category-tag">${esc(page.category)}</div>
            <div class="page-card-title-text">${esc(page.pageTitle || page.url)}</div>
            <div class="page-card-url-text">${esc(page.url)}</div>
            ${analysis && !analysis.error && analysis.pageType
              ? `<div class="page-type-line">Detected: <strong>${esc(analysis.pageType)}</strong> <span class="confidence-tag conf-${analysis.pageTypeConfidence || "low"}">${esc(analysis.pageTypeConfidence || "low")}</span></div>`
              : ""}
          </div>
          <div class="page-card-right">
            ${page.fetchMethod ? fetchMethodBadge(page.fetchMethod) : ""}
            ${aiScore !== null ? `<span class="ai-score-pill ${aiScoreClass(aiScore)}">${aiScore}/100</span>` : ""}
            ${hasError
              ? `<span class="count-pill count-pill-yellow">Error</span>`
              : `<span class="count-pill count-pill-green">${validCount} valid</span>
                 ${errCount > 0 ? `<span class="count-pill count-pill-yellow">${errCount} error${errCount !== 1 ? "s" : ""}</span>` : ""}`
            }
            <span class="expand-icon${expanded ? " open" : ""}" id="${bodyId}-icon">▼</span>
          </div>
        </div>`;

      let body;
      if (hasError) {
        body = `
          <div class="page-card-body is-error${expanded ? " open" : ""}" id="${bodyId}">
            <span>⚠️</span><span>${esc(page.error)}</span>
          </div>`;
      } else {
        body = `
          <div class="page-card-body${expanded ? " open" : ""}" id="${bodyId}">
            ${analysis && !analysis.error && analysis.summary ? aiSummaryPanel(analysis) : ""}
            ${schemasSection(page.schemas || [], ns, analysis)}
            ${errorsSection(page.parseErrors || [], ns)}
            ${missingSection(analysis)}
          </div>`;
      }

      return `<div class="page-card fade-in">${header}${body}</div>`;
    }

    function notFoundSection(categories) {
      return `
        <div class="not-found-section fade-in">
          <h3>Categories not found on this site</h3>
          ${categories.map(cat => `
            <div class="not-found-item">
              <span class="badge badge-gray">${esc(cat)}</span>
              <span>${esc(NOT_FOUND_NOTES[cat] || "No matching page was found for this category.")}</span>
            </div>`).join("")}
        </div>`;
    }

    // ── Shared section renderers ───────────────────────────────────────────
    function schemasSection(schemas, ns, analysis) {
      const inner = schemas.length === 0
        ? `<div class="placeholder-item"><div class="item-body"><div class="item-desc">No valid schema markup was found on this page.</div></div></div>`
        : schemas.map((s, i) => schemaItem(s, i, ns, analysis)).join("");

      return `
        <div class="section">
          <div class="section-header">
            <span>✅</span><h2>Implemented Correctly</h2>
            <span class="section-count">${schemas.length}</span>
          </div>
          ${inner}
        </div>`;
    }

    function schemaItem(s, idx, ns, analysis) {
      const id = `${ns}-schema-${idx}`;
      const type = Array.isArray(s.type) ? s.type.join(", ") : (s.type || "Unknown");
      const json = JSON.stringify(s.json, null, 2);

      // Find matching AI analysis for this schema type
      const aiInfo = analysis?.existingSchemaAnalysis?.find(
        (a) => a.schemaType?.toLowerCase() === type.toLowerCase()
      );
      const badgeClass = aiInfo?.status === "has_issues" ? "badge-yellow"
        : aiInfo?.status === "invalid" ? "badge-red"
        : "badge-green";

      const issuesHtml = aiInfo?.issues?.length
        ? `<div class="schema-issues">${aiInfo.issues.map(i => `<div class="schema-issue-item">• ${esc(i)}</div>`).join("")}</div>`
        : "";
      const notesHtml = aiInfo?.notes && !aiInfo.issues?.length
        ? `<div class="item-desc" style="margin-top:4px;font-size:0.78rem;">${esc(aiInfo.notes)}</div>`
        : "";

      return `
        <div class="schema-item">
          <div class="schema-item-header" onclick="toggleDrawer('${id}')">
            <span class="badge ${badgeClass}">${esc(type)}</span>
            <div class="item-body">
              <div class="item-desc">${esc(describeType(type))}</div>
              ${issuesHtml}${notesHtml}
            </div>
            <span class="expand-icon" id="${id}-icon">▼</span>
          </div>
          <div class="json-drawer" id="${id}">
            <pre>${esc(json)}</pre>
          </div>
        </div>`;
    }

    function errorsSection(parseErrors, ns) {
      const inner = parseErrors.length === 0
        ? `<div class="error-item"><div class="item-body"><div class="item-desc">No JSON-LD parse errors detected.</div></div></div>`
        : parseErrors.map(e => `
            <div class="error-item">
              <span class="badge badge-yellow">Parse Error</span>
              <div class="item-body">
                <div class="item-title">Malformed JSON-LD block</div>
                <div class="item-desc">${esc(e.error)}</div>
              </div>
            </div>`).join("");

      return `
        <div class="section">
          <div class="section-header">
            <span>⚠️</span><h2>Has Errors</h2>
            <span class="section-count">${parseErrors.length}</span>
          </div>
          ${inner}
        </div>`;
    }

    function missingSection(analysis) {
      if (!analysis || analysis.error) {
        return `
          <div class="section">
            <div class="section-header">
              <span>❌</span><h2>Missing</h2>
              <span class="section-count">–</span>
            </div>
            <div class="ai-unavailable">${analysis?.error ? `AI analysis unavailable: ${esc(analysis.error)}` : "AI analysis unavailable"}</div>
          </div>`;
      }

      const missing = analysis.missingSchemas || [];
      const inner = missing.length === 0
        ? `<div class="placeholder-item"><div class="item-body"><div class="item-desc">This page has appropriate schema coverage for its type.</div></div></div>`
        : missing.map(m => missingItem(m)).join("");

      return `
        <div class="section">
          <div class="section-header">
            <span>❌</span><h2>Missing</h2>
            <span class="section-count">${missing.length}</span>
          </div>
          ${inner}
        </div>`;
    }

    function missingItem(m) {
      const priClass = m.priority === "high" ? "pri-high" : m.priority === "medium" ? "pri-medium" : "pri-low";
      const fields = (m.recommendedFields || []).map(f => `<span class="field-tag">${esc(f)}</span>`).join("");
      return `
        <div class="missing-item">
          <span class="priority-badge ${priClass}">${esc(m.priority || "low")}</span>
          <div class="missing-item-body">
            <div class="missing-item-title">${esc(m.schemaType)}</div>
            <div class="missing-item-reason">${esc(m.reason)}</div>
            ${fields ? `<div class="field-tags">${fields}</div>` : ""}
          </div>
        </div>`;
    }

    function aiSummaryPanel(analysis) {
      return `
        <div class="ai-summary">
          <div class="ai-summary-label">✦ AI Analysis</div>
          ${esc(analysis.summary || "")}
        </div>`;
    }

    function aiScoreClass(score) {
      if (score >= 70) return "score-high";
      if (score >= 40) return "score-medium";
      return "score-low";
    }

    function fetchMethodBadge(method) {
      if (method === "rendered") {
        return `<span class="fetch-badge fetch-badge-rendered">🌐 JS-Rendered</span>`;
      }
      return `<span class="fetch-badge fetch-badge-static">⚡ Static HTML</span>`;
    }

    function showError(msg) {
      document.getElementById("results").innerHTML = `
        <div class="error-banner fade-in">
          <span>⚠️</span><span>Couldn't fetch the page: ${esc(msg)}</span>
        </div>`;
    }

    // ── Expand/collapse ────────────────────────────────────────────────────
    function toggleDrawer(id) {
      document.getElementById(id)?.classList.toggle("open");
      document.getElementById(id + "-icon")?.classList.toggle("open");
    }

    function togglePageCard(id) {
      document.getElementById(id)?.classList.toggle("open");
      document.getElementById(id + "-icon")?.classList.toggle("open");
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function animateBar(id, pct) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const bar = document.getElementById(id);
        if (bar) bar.style.width = pct + "%";
      }));
    }

    function esc(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    document.getElementById("urlInput").addEventListener("keydown", e => {
      if (e.key === "Enter") startScan();
    });
  </script>

</body>
</html>
